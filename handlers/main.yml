---
# handlers file for ansible-role-maxscale
- name: Verify maxscale config
  become: true
  become_user: maxscale
  ansible.builtin.command: "/usr/bin/maxscale -c"
  changed_when: false
  notify: Restart maxscale

- name: Restart maxscale
  ansible.builtin.service:
    name: maxscale
    state: restarted
