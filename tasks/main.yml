---
# tasks file for ansible-role-maxscale
- name: Create maxscale database users in MySQL
  when: not maxscale_use_mariadb | bool
  ansible.builtin.include_tasks: database_preparation/mysql.yml

- name: Create maxscale database users in MariaDB
  when: maxscale_use_mariadb | bool
  ansible.builtin.include_tasks: database_preparation/mariadb.yml

- name: Install maxscale
  when: not maxscale_use_docker | bool
  ansible.builtin.include_tasks: install.yml

- name: Start docker container
  when: maxscale_use_docker | bool
  ansible.builtin.include_tasks: docker.yml
